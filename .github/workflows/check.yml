name: check

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile helper scripts
        run: python3 -m py_compile tools/*.py dev/*.py
      - name: JavaScript parses
        run: |
          node --check launcher.js
          node --check engines.js
          node --check engine/engine.worker.js
          node --check engine/gzdoom414/driver.js
      - name: No game data committed
        run: |
          if git ls-files | grep -Ei '\.(wad|pk3|ipk3|zip)$'; then
            echo "Game data must not be committed." >&2
            exit 1
          fi
      - name: Bundles, version and registry agree with their source
        run: python3 tools/verify.py
